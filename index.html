<style type="text/tailwindcss" data-app="1">
  .panel{@apply bg-cream border-[3px] border-ink rounded-3xl shadow-pop;}
  .btn{@apply font-disp tracking-wide rounded-2xl border-[3px] border-ink shadow-pop px-4 py-2 transition-all duration-100 select-none cursor-pointer inline-flex items-center justify-center gap-2;touch-action:manipulation;}
  .btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:none;}
  .btn:disabled{@apply opacity-40 cursor-not-allowed;}
  .chip{@apply inline-flex items-center gap-1.5 bg-cream border-[3px] border-ink rounded-full px-3 py-1 font-extrabold text-sm shadow-pops;}
  .tabbtn{@apply font-disp text-xs px-3 py-1.5 rounded-2xl border-[3px] border-ink bg-cream transition-all;}
  .tabbtn.active{@apply bg-gold translate-y-[2px];box-shadow:none;}
  .bar{@apply h-3.5 rounded-full bg-ink/15 border-2 border-ink/30 overflow-hidden;}
  .bar>div{@apply h-full rounded-full transition-all duration-500;}
  .pip{@apply w-3 h-5 rounded-md border-2 border-ink/50 bg-ink/10 transition-all;}
  .pip.on{@apply bg-gold border-ink;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);}
  .itemcard{@apply bg-white/85 border-[3px] border-ink rounded-2xl p-3 flex flex-col gap-1.5 shadow-pops transition-transform hover:-translate-y-1;}
  .name-input{@apply flex-1 min-w-0 border-[3px] border-ink rounded-2xl px-3 py-2 font-extrabold bg-white/95 text-ink placeholder:text-ink/35 focus:outline-none focus:ring-4 focus:ring-gold/60;}
  .iconbtn{@apply btn !px-1.5 !py-1 !text-[13px] shrink-0;}
  .hudbtn{@apply !px-2.5 !py-1 !text-base pointer-events-auto;}
  .actbtn{@apply btn w-full h-full flex-col !gap-0 !px-1 !py-0.5 text-center leading-tight overflow-hidden;}
  .logrow{@apply flex gap-2 items-start text-[12.5px] leading-relaxed font-bold;}
  .hostcard{@apply rounded-2xl border-[3px] border-ink p-3 shadow-pops bg-white/85;}
  .stepli{@apply flex gap-2 text-[12px] font-bold leading-snug;}
  .codeblk{@apply font-mono text-[10.5px] leading-relaxed bg-ink text-cream/90 rounded-xl p-2.5 overflow-x-auto scroll-slim whitespace-pre;}
</style>
<style data-app="1">
  #shell{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
  #shell header,#shell nav,#shell footer{flex-shrink:0}
  #shell main{flex:1;position:relative;overflow:hidden;min-height:0}
  .tabscreen{position:absolute;inset:0}
  .hide{display:none!important}
  html,body{overscroll-behavior:none}
  .scroll-slim{scrollbar-width:thin;scrollbar-color:#ffb703 #fff3da}
  .scroll-slim::-webkit-scrollbar{width:12px;height:12px}
  .scroll-slim::-webkit-scrollbar-track{background:#fff3da;border-radius:99px;border:2px solid #ffe6b8}
  .scroll-slim::-webkit-scrollbar-thumb{background:#ffb703;border:2px solid #14324f;border-radius:99px}
  .scroll-slim::-webkit-scrollbar-thumb:hover{background:#ff5d5d}
  .ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:10px;background:rgba(16,32,63,.5);backdrop-filter:blur(2px);z-index:40}
  .ov.open{display:flex}
  .ov.lite{background:rgba(20,50,79,.32);backdrop-filter:none}
  .gamemsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:35}
  .gamemsg.open{display:flex}
  .popup-layer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:14px}
  .popup-scrim{position:absolute;inset:0;background:rgba(12,28,48,.72);backdrop-filter:blur(3px)}
  .popup-card{position:relative;width:100%;max-width:34rem;max-height:calc(100dvh - 28px);display:flex;flex-direction:column}
  .stage{position:relative;flex:0 0 auto;margin-inline:auto;--s:1}
  .swipe-pad{position:relative;touch-action:none;user-select:none;-webkit-user-select:none;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(159,224,251,.35));}
  .swipe-pad::after{content:'';position:absolute;inset:0;border-radius:22px;box-shadow:inset 0 0 0 0 rgba(255,183,3,0);transition:box-shadow .18s;pointer-events:none}
  .swipe-pad.ping::after{box-shadow:inset 0 0 0 6px rgba(255,183,3,.55)}
  .pad-arrow{position:absolute;pointer-events:none;font-size:26px;animation:padArrow .6s ease-out forwards;z-index:5}
  @keyframes padArrow{0%{opacity:.95;transform:translate(-50%,-50%) scale(.7)}100%{opacity:0;transform:translate(-50%,-160%) scale(1.5)}}
  @keyframes chevUp{0%,100%{transform:translateY(6px);opacity:.35}50%{transform:translateY(-6px);opacity:.9}}
  @keyframes chevLR{0%,100%{transform:translateX(-7px);opacity:.4}50%{transform:translateX(7px);opacity:.95}}
  .chev-up{animation:chevUp 1.5s ease-in-out infinite}
  .chev-lr{animation:chevLR 1.8s ease-in-out infinite}
  .gb{position:absolute;inset:0;background:#9bbc0f;color:#0f380f;overflow:hidden}
  .gb::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(15,56,15,.10) 0 2px,transparent 2px 4px);pointer-events:none;z-index:6}
  .gb-info{position:absolute;background:#9bbc0f;border:calc(2.5px*var(--s)) solid #0f380f;border-radius:calc(6px*var(--s));padding:calc(4px*var(--s)) calc(6px*var(--s));box-shadow:calc(2px*var(--s)) calc(2px*var(--s)) 0 #306230;z-index:3}
  .gb-row{display:flex;align-items:baseline;justify-content:space-between;gap:calc(4px*var(--s))}
  .gb-name{font-family:'Press Start 2P',monospace;font-size:calc(12px*var(--s));line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gb-lv{font-weight:900;font-size:calc(12px*var(--s));flex-shrink:0;line-height:1.2}
  .gb-hpbar{height:calc(7px*var(--s));background:#8bac0f;border:calc(2px*var(--s)) solid #0f380f;border-radius:99px;overflow:hidden;margin-top:calc(3px*var(--s))}
  .gb-hpfill{height:100%;background:#306230;transition:width .45s cubic-bezier(.2,1,.3,1)}
  .gb-hpnum{font-weight:900;font-size:calc(11px*var(--s));text-align:right;line-height:1.2;margin-top:calc(1px*var(--s))}
  .gb-sprite{position:absolute;z-index:2;filter:grayscale(1) sepia(1) saturate(3.2) hue-rotate(32deg) brightness(.98) contrast(1.12)}
  .gb-sprite svg{width:100%;height:auto;display:block}
  .gb-msg{position:absolute;left:0;right:0;bottom:0;height:26%;background:#9bbc0f;border-top:calc(3px*var(--s)) solid #0f380f;padding:calc(6px*var(--s)) calc(9px*var(--s));font-family:'Press Start 2P',monospace;font-size:calc(12px*var(--s));line-height:1.7;z-index:4;display:flex;align-items:flex-start;gap:6px;overflow:hidden}
  .gb-cursor{animation:blinkC .7s steps(1) infinite;font-size:calc(10px*var(--s));flex-shrink:0}
  @keyframes blinkC{0%,49%{opacity:1}50%,100%{opacity:0}}
  .gb-hit{animation:gbShake .32s linear}
  @keyframes gbShake{0%,100%{transform:translate(0,0)}25%{transform:translate(-5px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-2px)}}
  .gb-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
  .gb-flash.go{animation:gbFlash .3s ease-out}
  @keyframes gbFlash{0%{opacity:.85}100%{opacity:0}}
  .dmg-float{position:absolute;font-family:'Luckiest Guy',cursive;font-size:calc(24px*var(--s));color:#0f380f;text-shadow:2px 2px 0 #9bbc0f;animation:dmgUp .9s ease-out forwards;pointer-events:none;z-index:8}
  @keyframes dmgUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}25%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-46px) scale(1)}}
  .die-box{width:clamp(52px,13vh,88px);aspect-ratio:1;flex-shrink:0}
  .die-sm{width:clamp(34px,7vh,46px);aspect-ratio:1}
  .die-roll{animation:dieSpin .09s linear infinite}
  @keyframes dieSpin{0%{transform:rotate(-7deg) scale(1)}50%{transform:rotate(7deg) scale(1.06)}100%{transform:rotate(-7deg) scale(1)}}
  .stamp{animation:stampIn .35s cubic-bezier(.2,1.6,.4,1) both}
  @keyframes stampIn{0%{transform:scale(2.2) rotate(-14deg);opacity:0}60%{transform:scale(.92) rotate(-6deg);opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
  @keyframes drift{from{transform:translateX(-22vw)}to{transform:translateX(115vw)}}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7)}50%{opacity:.9;transform:scale(1.2)}}
  @keyframes slimeIdle{0%,100%{transform:scale(1,1)}30%{transform:scale(1.045,.955)}60%{transform:scale(.97,1.035)}}
  @keyframes floatK{0%,100%{transform:translateY(-6px) scale(1,1)}50%{transform:translateY(-18px) scale(.98,1.03)}}
  @keyframes wiggleK{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
  @keyframes popIn{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  @keyframes riseP{0%{transform:translateY(0) scale(.9);opacity:1}100%{transform:translateY(-130px) scale(1.35);opacity:0}}
  @keyframes glowP{0%,100%{box-shadow:0 0 0 0 rgba(255,183,3,.85)}50%{box-shadow:0 0 0 14px rgba(255,183,3,0)}}
  @keyframes evoShake{0%,100%{transform:translate(0,0) scale(1)}20%{transform:translate(-5px,2px) scale(1.04)}40%{transform:translate(5px,-3px) scale(1.06)}60%{transform:translate(-4px,-2px) scale(1.08)}80%{transform:translate(4px,2px) scale(1.1)}}
  @keyframes evoFlash{0%{opacity:0}40%{opacity:1}100%{opacity:0}}
  @keyframes bounceK{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes riseZ{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-60px) scale(1.25)}}
  @keyframes chompK{0%,100%{transform:scale(1)}30%{transform:scale(1.14,.86)}60%{transform:scale(.92,1.1)}}
  @keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.35);opacity:.6}}
  @keyframes hopPreview{0%,100%{transform:translateY(0) scale(1,1)}35%{transform:translateY(-26px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.1,.9)}}
  @keyframes flashRed{0%{opacity:.55}100%{opacity:0}}
  @keyframes saveFlash{0%{transform:scale(1)}45%{transform:scale(2.1);background:#58c453;box-shadow:0 0 8px #58c453}100%{transform:scale(1)}}
  @keyframes timePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  @keyframes mascotBob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-5px) scale(.98,1.03)}70%{transform:translateY(0) scale(1.04,.96)}}
  .mascot-bob{animation:mascotBob 2.6s ease-in-out infinite;transform-origin:bottom center;display:inline-block}
  .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;animation:drift linear infinite}
  .cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:999px}
  .cloud::before{width:55%;height:150%;left:12%;top:-70%}
  .cloud::after{width:40%;height:110%;right:10%;top:-45%}
  .slime-idle{animation:slimeIdle 2.2s ease-in-out infinite;transform-origin:bottom center}
  .slime-float{animation:floatK 3s ease-in-out infinite;transform-origin:bottom center}
  .egg-idle{animation:wiggleK 3s ease-in-out infinite;transform-origin:bottom center}
  .pop-in{animation:popIn .5s cubic-bezier(.2,1.4,.4,1) both}
  .glow-pulse{animation:glowP 1.2s infinite}
  .chomp{animation:chompK .5s ease-in-out 2}
  .particle{position:absolute;pointer-events:none;animation:riseP 1.1s ease-out forwards;font-size:22px;z-index:40}
  .zzz{position:absolute;pointer-events:none;animation:riseZ 2.2s ease-out forwards;font-weight:900;color:#cde7ff}
  .toast-in{animation:popIn .35s cubic-bezier(.2,1.4,.4,1) both}
  .nav-dot{position:absolute;top:5px;right:20%;width:10px;height:10px;border-radius:99px;background:#ff5d5d;border:2px solid #fff9ef;animation:dotPulse 1s infinite}
  .nav-dot.gold{background:#ffb703}
  #saveDot{width:7px;height:7px;border-radius:99px;background:rgba(88,196,83,.55);display:inline-block;cursor:pointer}
  .save-flash{animation:saveFlash .8s ease-out}
  .game-canvas{touch-action:none;user-select:none;-webkit-user-select:none;display:block;width:100%;height:100%}
  .evo-flash{position:absolute;inset:0;background:#fff;border-radius:24px;animation:evoFlash .8s ease-out forwards;pointer-events:none}
  .time-low{animation:timePulse .5s infinite;color:#ff5d5d!important}
</style>
</head>
<body class="font-body text-ink bg-gradient-to-b from-[#8fd9f7] via-[#c9ecfb] to-[#d8f3d0]">
<noscript><div style="padding:2rem;font-family:sans-serif;text-align:center">SlimeGochi butuh JavaScript 🫧</div></noscript>

<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
  <div class="cloud w-40 h-12" style="top:10%;animation-duration:75s"></div>
  <div class="cloud w-28 h-9" style="top:26%;animation-duration:100s;animation-delay:-40s"></div>
  <div class="cloud w-52 h-14" style="top:58%;animation-duration:130s;animation-delay:-70s;opacity:.55"></div>
  <span class="absolute text-gold" style="left:10%;top:38%;animation:twinkle 3s infinite">✦</span>
  <span class="absolute text-white" style="left:80%;top:20%;animation:twinkle 4s infinite .8s">✦</span>
</div>

<div id="shell" class="relative z-10">
  <header class="flex items-center gap-1.5 px-2 py-1.5 bg-cream/85 border-b-[3px] border-ink">
    <h1 class="font-disp text-[13px] min-[380px]:text-[16px] leading-none truncate min-w-0">Slime<span class="text-deep">Gochi</span></h1>
    <div class="flex items-center gap-1.5 ml-auto shrink-0">
      <span class="chip !py-0.5 !px-2 !text-xs" title="Koin">🪙 <b id="coinTxt">0</b></span>
      <span class="chip !py-0.5 !px-2 !text-xs hidden min-[400px]:inline-flex" title="Instant-Hatch">⚡ <b id="hatchTxt">0</b></span>
      <button id="btnSound" class="iconbtn bg-white" title="Suara">🔊</button>
      <button id="btnHelp" class="iconbtn bg-white" title="Panduan">❓</button>
      <button id="btnReset" class="iconbtn bg-red-200" title="Reset progres">↺</button>
    </div>
  </header>

  <main>
    <div id="tab-home" class="tabscreen overflow-hidden"></div>
    <div id="tab-egg" class="tabscreen hide overflow-y-auto scroll-slim"></div>

    <div id="tab-battle" class="tabscreen hide">
      <div id="arena-hub" class="absolute inset-0 overflow-y-auto scroll-slim"></div>
      <div id="arena-rps" class="absolute inset-0 hide overflow-y-auto scroll-slim"></div>

      <!-- SLIMEGO! -->
      <div id="arena-run" class="absolute inset-0 hide p-2 flex flex-col gap-2">
        <div id="run-wrap" class="stage rounded-3xl border-[3px] border-ink shadow-pop overflow-hidden bg-[#8fd9f7]">
          <canvas id="run-canvas" class="game-canvas"></canvas>
          <div class="absolute top-2 left-2 right-2 flex items-start gap-1.5 z-20 pointer-events-none">
            <span class="chip !py-0.5 !px-2.5 !text-xs">🏁 <b id="hud-dist">0 m</b></span>
            <span class="chip !py-0.5 !px-2.5 !text-xs">🪙 <b id="hud-coin">0</b></span>
            <span class="chip !py-0.5 !px-2.5 !text-xs" title="Kesempatan lanjut">🔁 <b id="hud-cont">3</b></span>
            <span class="ml-auto flex gap-1.5">
              <button class="btn hudbtn bg-cream" title="Jeda" onclick="Run.openMenu('pause')">⏸</button>
              <button class="btn hudbtn bg-red-200" title="Keluar" onclick="Run.openMenu('quit')">✕</button>
            </span>
          </div>
          <div id="run-flash" class="absolute inset-0 z-20 pointer-events-none bg-coral opacity-0"></div>
          <div id="run-msg" class="gamemsg"><span id="run-msg-txt" class="font-disp text-5xl text-white drop-shadow-[4px_4px_0_rgba(20,50,79,.9)]">GO!</span></div>
        </div>

function toast(emoji,msg){const t=document.createElement('div');t.className='toast-in bg-ink text-cream font-bold px-4 py-2 rounded-full border-[3px] border-cream/40 shadow-lg flex items-center gap-2 text-sm';t.innerHTML=`<span class="text-lg">${emoji}</span>${esc(msg)}`;$('#toasts').appendChild(t);setTimeout(()=>{t.style.transition='all .4s';t.style.opacity=0;t.style.transform='translateY(10px)';setTimeout(()=>t.remove(),400);},2400);}
function burst(el,emojis,n=8){if(!el)return;const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const s=document.createElement('span');s.className='particle';s.textContent=emojis[i%emojis.length];s.style.left=(r.width*.5+(Math.random()-.5)*r.width*.5)+'px';s.style.top=(r.height*.5+(Math.random()-.5)*r.height*.3)+'px';s.style.animationDelay=(Math.random()*.25)+'s';el.appendChild(s);setTimeout(()=>s.remove(),1500);}}
function showModal(html){const m=$('#modal-root');m.innerHTML=`<div class="absolute inset-0 bg-ink/60 backdrop-blur-sm" onclick="closeModal()"></div><div class="absolute inset-0 flex items-center justify-center p-3 pointer-events-none"><div class="pointer-events-auto pop-in max-w-lg w-full max-h-[90dvh] overflow-y-auto scroll-slim rounded-3xl">${html}</div></div>`;m.classList.remove('hide');}
function closeModal(){$('#modal-root').classList.add('hide');$('#modal-root').innerHTML='';}
function statRow(icon,label,val,cls){return `<div class="flex justify-between items-center gap-3 py-[3px]"><span class="opacity-80">${icon} ${label}</span><b class="font-disp text-base ${cls||''}">${val}</b></div>`;}

/* ============================ PET CORE ============================ */
function addCoins(n){S.coins+=n;if(n>0)sfx('coin');const c=$('#coinTxt');c.classList.remove('pop-in');void c.offsetWidth;c.classList.add('pop-in');renderHeader();}
function toyBonus(){return Math.min(3,S.inv.toys.reduce((a,id)=>a+(TOYS.find(t=>t.id===id)?.bonus||0),0));}
function applyExp(p,x){if(x<=0||!p)return;if(p.level>=MAX_LV){p.exp=0;return;}p.exp+=x;let ups=0;
  while(p.level<MAX_LV&&p.exp>=EXP_NEED(p.level)){p.exp-=EXP_NEED(p.level);p.level++;ups++;}
  if(p.level>=MAX_LV)p.exp=0;
  if(ups>0){sfx('level');toast('🎉',`${p.nick} naik ke LV.${p.level}! HP maks ${maxHP(p)}`);
    if(p.level>=EVO_LV&&!p.evolved&&p.level-ups<EVO_LV)toast('🧬','LV.10 tercapai — saatnya EVOLUSI di Rumah!');
    renderNav();}}
function canAct(p,need=true){if(!p){toast('🥚','Belum ada slime! Tetaskan telur dulu.');return false;}if(p.sleepUntil&&p.sleepUntil>Date.now()){toast('💤','Ssst… dia sedang tidur.');return false;}if(need&&p.energy<ACT_COST){toast('⚡','Energi habis! Beri makan atau tidurkan.');return false;}return true;}
function setTempMood(p,m){p.tempMood=m;p.tempMoodUntil=Date.now()+2600;}
const gameBusy=()=>[Run,Rain,T].some(g=>g.phase!=='idle'&&g.phase!=='over')||!!(B&&!B.over);
function doPlay(){const p=activePet();if(!canAct(p))return;p.energy-=ACT_COST;p.fun=Math.min(100,p.fun+20);const e=4+toyBonus();applyExp(p,e);addCoins(2);setTempMood(p,'excite');burst($('#scene'),['🎾','⭐','✨','🫧']);sfx('pop');toast('🎾',`Main seru! +${e} EXP`);save();renderHome();}
function doService(){const p=activePet();if(!canAct(p))return;p.energy-=ACT_COST;p.clean=Math.min(100,p.clean+45);applyExp(p,3);addCoins(1);setTempMood(p,'excite');burst($('#scene'),['🫧','🧼','✨','💧']);sfx('pop');toast('🫧','Kinclong! +3 EXP');save();renderHome();}
function openFoodTray(){const p=activePet();if(!p)return;if(p.sleepUntil&&p.sleepUntil>Date.now())return toast('💤','Ssst… dia sedang tidur.');const owned=FOODS.filter(f=>(S.inv.foods[f.id]||0)>0);
  showModal(`<div class="panel p-5"><h3 class="font-disp text-2xl mb-1">🍽️ Pilih Makanan</h3><p class="text-xs font-bold opacity-70 mb-3">Makan = −${ACT_COST}⚡ lalu energi bertambah.</p>${owned.length?owned.map(f=>`<button onclick="doFeed('${f.id}')" class="itemcard w-full !flex-row items-center mb-2 hover:bg-cream2">${iconSVG(f.id,44)}<span class="flex-1 text-left"><b>${f.name}</b> ×${S.inv.foods[f.id]}<br><span class="text-xs opacity-70">+${f.energy}⚡ · +${f.full} kenyang · +3 EXP</span></span><span class="btn bg-gold !py-1 !px-3 text-sm">Makan!</span></button>`).join(''):`<p class="text-center py-6 font-bold">Tas makanan kosong 😅<br><button onclick="closeModal();setTab('shop')" class="btn bg-gold mt-3 text-sm">Belanja 🛍️</button></p>`}<button onclick="closeModal()" class="btn bg-white w-full mt-2 text-sm">Tutup</button></div>`);}
function doFeed(fid){const p=activePet(),f=FOODS.find(x=>x.id===fid);if(!p||!f||(S.inv.foods[fid]||0)<=0)return;if(p.sleepUntil&&p.sleepUntil>Date.now())return toast('💤','Ssst… dia sedang tidur.');S.inv.foods[fid]--;p.energy=Math.max(0,Math.min(ENERGY_MAX,p.energy-ACT_COST+f.energy));p.full=Math.min(100,p.full+f.full);applyExp(p,3);addCoins(1);setTempMood(p,'excite');closeModal();sfx('eat');burst($('#scene'),['❤️','✨','🫧']);const el=$('#pet-holder');if(el){el.classList.remove('chomp');void el.offsetWidth;el.classList.add('chomp');}toast('😋',`${f.name} lezat! +3 EXP`);save();renderHome();}
function sleepDur(){return S.inv.pillow?30000:60000;}
function doSleep(){const p=activePet();if(!p)return;if(p.sleepUntil&&p.sleepUntil>Date.now())return;p.sleepUntil=Date.now()+sleepDur();p.tempMood=null;sfx('click');toast('💤',`Tidur… ${sleepDur()/1000} detik untuk energi penuh.`);save();renderHome();}
function doWake(){const p=activePet();if(!p||!p.sleepUntil)return;const dur=sleepDur(),left=p.sleepUntil-Date.now();if(left<=0)p.energy=ENERGY_MAX;else{const g=Math.floor((dur-left)/dur*ENERGY_MAX);p.energy=Math.min(ENERGY_MAX,p.energy+g);toast('⏰',`Dibangunkan! +${g}⚡`);}p.sleepUntil=null;save();renderHome();}
const nextHatchMs=()=>HATCH_BASE*Math.pow(5,S.hatchCount);
function startIncubation(){if(S.incubator)return toast('🥚','Inkubator masih terisi!');const dur=nextHatchMs();S.incubator={endsAt:Date.now()+dur,dur};sfx('pop');closeModal();toast('🥚','Telur slime mulai dierami!');save();setTab('egg');}
function useInstantHatch(){if(!S.incubator)return;if(S.inv.hatch<=0)return toast('⚡','Instant-Hatch habis! Beli di Toko.');S.inv.hatch--;S.incubator.endsAt=Date.now();sfx('pop');toast('⚡','Instant-Hatch dipakai!');save();renderHeader();if(curTab==='egg')renderEgg();}
let HATCH_PENDING=null;
function hatchNow(){const inc=S.incubator;if(!inc||inc.endsAt>Date.now())return;if(gameBusy())return toast('🎮','Selesaikan minigame dulu!');const def=pickNick();
  const pet={id:'p'+Date.now()+rnd(999),nick:def,element:null,evolved:false,level:1,exp:0,energy:ENERGY_MAX,full:80,fun:80,clean:80,skin:'default',head:null,face:null,neck:null,bonus:zeroAttr(),gift:zeroAttr(),sleepUntil:null,tempMood:null,tempMoodUntil:0,bornAt:Date.now()};
  HATCH_PENDING={pet,def};sfx('hatch');
  showModal(`<div class="panel p-6 text-center relative overflow-hidden"><p class="font-disp text-xl text-deep">TOK… TOK… PLOP! 🎊</p><div class="my-2 flex justify-center pop-in"><div class="slime-idle">${slimeSVG(pet,160,'excite')}</div></div><div class="flex justify-center gap-2 mb-2 flex-wrap"><span class="chip">LV.1</span><span class="chip">🫧 Slime Murni</span><span class="chip">❤️ ${maxHP(pet)} HP</span></div><h3 class="font-disp text-2xl">Beri Nama Slime-mu!</h3><p class="text-xs font-bold opacity-70 mt-1 mb-3">Ketik nama sendiri, atau pakai nama default.<br>Kosongkan kolom untuk memakai default.</p><div class="flex gap-2 items-center"><input id="hatch-name" class="name-input" maxlength="${NAME_MAX}" placeholder="${esc(def)}" autocomplete="off" autocapitalize="words" spellcheck="false"/><button onclick="rerollHatchName()" class="btn bg-cream2 !px-3 !py-2 text-lg" title="Acak">🎲</button></div><div class="flex justify-between items-center text-[11px] font-bold opacity-80 mt-1.5"><button onclick="useDefaultName()" class="underline decoration-dotted hover:text-deep">Default: <b id="hatch-def">${esc(def)}</b></button><span id="hatch-count">0/${NAME_MAX}</span></div><button onclick="confirmHatch()" class="btn bg-gold w-full mt-3 text-lg">Peluk & Mulai! 🤗</button><p class="text-[10px] font-bold opacity-50 mt-2">Level maks 100 · evolusi di LV.10 membuka 1 dari 10 elemen langka + 5 poin atribut permanen! 🧬</p></div>`);
  const inp=$('#hatch-name');inp.addEventListener('input',hatchInputSync);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();confirmHatch();}});hatchInputSync();}
function hatchInputSync(){const i=$('#hatch-name'),c=$('#hatch-count');if(i&&c)c.textContent=`${i.value.length}/${NAME_MAX}`;}
function rerollHatchName(){if(!HATCH_PENDING)return;HATCH_PENDING.def=pickNick();const d=$('#hatch-def'),i=$('#hatch-name');if(d)d.textContent=HATCH_PENDING.def;if(i)i.placeholder=HATCH_PENDING.def;sfx('click');}
function useDefaultName(){if(!HATCH_PENDING)return;const i=$('#hatch-name');if(i){i.value=HATCH_PENDING.def;hatchInputSync();i.focus();}sfx('click');}
function confirmHatch(){if(!HATCH_PENDING)return;const i=$('#hatch-name');const name=((i?i.value:'').trim().replace(/\s+/g,' ').slice(0,NAME_MAX))||HATCH_PENDING.def;const pet=HATCH_PENDING.pet;pet.nick=name;HATCH_PENDING=null;S.hatchCount++;S.pets.push(pet);S.activeId=pet.id;S.incubator=null;SPR.key='';sfx('level');save();closeModal();renderHeader();renderNav();setTab('home');burst($('#scene'),['✨','🎉','⭐','🫧'],14);toast('🤗',`${name} bergabung denganmu!`);}
let EVO_BUSY=false;
function giftChips(g){return ATTR_KEYS.filter(k=>g[k]>0).map(k=>{const a=ATTR.find(x=>x.k===k);return `<span class="chip !text-xs !bg-cream2">${a.emoji} ${a.k.toUpperCase()} <b class="text-violet">+${g[k]}</b></span>`;}).join(' ');}
function evolve(){const p=activePet();if(!evoReady(p)||EVO_BUSY)return;if(gameBusy())return toast('🎮','Selesaikan minigame dulu!');EVO_BUSY=true;sfx('hatch');
  showModal(`<div class="panel p-6 text-center relative overflow-hidden" id="evo-panel"><p class="font-disp text-2xl text-violet">🧬 EVOLUSI!</p><p class="text-xs font-bold opacity-70">Cahaya elemen menyelimuti ${esc(p.nick)}…</p><div id="evo-stage" class="my-3 flex justify-center"><div style="animation:evoShake 1.1s infinite;filter:drop-shadow(0 0 18px #ffb703)">${slimeSVG(p,170,'excite')}</div></div><div id="evo-result"></div></div>`);
  setTimeout(()=>{
    const el=EVO_KEYS[rnd(EVO_KEYS.length)];
    const gift=zeroAttr();for(let i=0;i<EVO_GIFT;i++)gift[ATTR_KEYS[rnd(4)]]++;
    p.element=el;p.evolved=true;p.gift=gift;
    if(!S.dex.includes(el))S.dex.push(el);
    SPR.key='';save();
    const E=EVOS[el],stage=$('#evo-stage');
    if(stage){const fl=document.createElement('div');fl.className='evo-flash';$('#evo-panel').appendChild(fl);
      stage.innerHTML=`<div class="pop-in">${slimeSVG(p,175,'excite')}</div>`;
      $('#evo-result').innerHTML=`<h3 class="font-disp text-3xl pop-in">${E.emoji} ${E.name}!</h3><p class="chip mt-1">${E.emoji} Slime ${E.label}</p>
        <p class="text-sm font-bold opacity-75 mt-2">${esc(p.nick)} berevolusi menjadi <b>Slime ${E.label}</b> dan mewarisi <b>${EVO_GIFT} poin atribut permanen</b>!</p>
        <div class="flex flex-wrap justify-center gap-1.5 mt-2">${giftChips(gift)}</div>
        <p class="text-[11px] font-bold opacity-60 mt-2">❤️ HP maksimum sekarang <b>${maxHP(p)}</b> · warisan ini tidak bisa hilang.</p>
        <button onclick="closeModal();renderHome();renderNav()" class="btn bg-gold w-full mt-3 text-lg">Luar biasa! ✨</button>`;
      burst($('#evo-panel'),['✨','🎉','⭐',E.emoji],16);sfx('level');}
    EVO_BUSY=false;renderNav();},1300);}

/* ============================ ENGINE ============================ */
function makeLoop(step){let raf=0,on=false,last=0;
  function tick(t){if(!on)return;const dt=Math.min(.034,Math.max(0,(t-last)/1000));last=t;try{step(dt,t);}catch(e){console.error('[game]',e);}if(on)raf=requestAnimationFrame(tick);}
  return{start(){if(on)return;on=true;last=performance.now();raf=requestAnimationFrame(tick);},stop(){on=false;cancelAnimationFrame(raf);raf=0;},get on(){return on;}};}
function lerp(a,b,t){return a+(b-a)*t;}
function hexLerp(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);return `rgb(${Math.round(lerp(pa>>16,pb>>16,t))},${Math.round(lerp((pa>>8)&255,(pb>>8)&255,t))},${Math.round(lerp(pa&255,pb&255,t))})`;}
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function layoutStage(arenaSel,stageSel,padMin){
  const a=$(arenaSel),s=$(stageSel);if(!a||!s)return;
  const cs=getComputedStyle(a);
  const aw=a.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=a.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-8;
  if(aw<60||ah<60)return;
  let w=aw,h=w*9/16;const maxH=Math.max(100,ah-padMin);
  if(h>maxH){h=maxH;w=h*16/9;}
  s.style.width=Math.floor(w)+'px';s.style.height=Math.floor(h)+'px';
  s.style.setProperty('--s',(w/680).toFixed(3));}
function fitCanvas(wrap,canvas){const w=wrap.clientWidth,h=wrap.clientHeight;if(w<10||h<10)return null;const dpr=Math.min(2,window.devicePixelRatio||1);const u=Math.max(.5,Math.min(h/420,w/680));canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);return{W:w/u,H:h/u,u,dpr,groundY:h/u-64};}
function padPing(pad,x,y,glyph){if(!pad)return;pad.classList.add('ping');setTimeout(()=>pad.classList.remove('ping'),170);
  const r=pad.getBoundingClientRect(),s=document.createElement('span');s.className='pad-arrow';s.textContent=glyph;
  s.style.left=(x-r.left)+'px';s.style.top=(y-r.top)+'px';pad.appendChild(s);setTimeout(()=>s.remove(),620);}
function bindSwipeUp(el,game,pad){let ptr=null;
  el.addEventListener('pointerdown',e=>{e.preventDefault();ptr={x:e.clientX,y:e.clientY,sw:false};if(e.pointerType==='mouse'&&el.tagName==='CANVAS'){game.jump();ptr.sw=true;}try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!ptr||ptr.sw)return;if(ptr.y-e.clientY>16){ptr.sw=true;game.jump();if(pad)padPing(pad,e.clientX,e.clientY,'▲');}});
  el.addEventListener('pointerup',e=>{if(ptr&&!ptr.sw&&ptr.y-e.clientY>10){game.jump();if(pad)padPing(pad,e.clientX,e.clientY,'▲');}ptr=null;});
  el.addEventListener('pointercancel',()=>ptr=null);
  el.addEventListener('contextmenu',e=>e.preventDefault());}
function bindDrag(el,game,pad){let ptr=null;
  el.addEventListener('pointerdown',e=>{e.preventDefault();ptr={x:e.clientX,base:game.targetX,moved:0};try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!ptr)return;const dx=(e.clientX-ptr.x)/game.u;ptr.moved=Math.max(ptr.moved,Math.abs(e.clientX-ptr.x));game.targetX=Math.min(Math.max(ptr.base+dx,60),game.W-60);});
  const up=e=>{if(ptr&&ptr.moved<6&&pad){const r=pad.getBoundingClientRect();const dir=(e.clientX-r.left)<r.width/2?-1:1;game.targetX=Math.min(Math.max(game.targetX+dir*70,60),game.W-60);padPing(pad,e.clientX,e.clientY,dir<0?'◀':'▶');}ptr=null;};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',()=>ptr=null);
  el.addEventListener('contextmenu',e=>e.preventDefault());}

const RUN={G:2600,JUMP:-960,BASE:340,MAX:780,ACC:7.5,X:120,SIZE:82};
const SKY_STOPS=[
  {t:0,top:'#8fd9f7',bot:'#dff6ff',hA:'#a8dd8c',hB:'#7ec850',gr:'#6cbb56',soil:'#8a5a3b',n:0},
  {t:.28,top:'#ffb27a',bot:'#ffe3c2',hA:'#b7a06a',hB:'#8f9a55',gr:'#7aa851',soil:'#7c4f33',n:0},
  {t:.46,top:'#10203f',bot:'#274067',hA:'#24405c',hB:'#1b3350',gr:'#2e5a4a',soil:'#23303f',n:1},
  {t:.72,top:'#10203f',bot:'#274067',hA:'#24405c',hB:'#1b3350',gr:'#2e5a4a',soil:'#23303f',n:1},
  {t:.88,top:'#7fb6d9',bot:'#ffd9e0',hA:'#8fb98a',hB:'#6fae62',gr:'#63b054',soil:'#7c4f33',n:.15},
  {t:1,top:'#8fd9f7',bot:'#dff6ff',hA:'#a8dd8c',hB:'#7ec850',gr:'#6cbb56',soil:'#8a5a3b',n:0}];
const Run={
  phase:'idle',loop:null,pet:null,W:680,H:420,u:1,dpr:1,groundY:356,
  dist:0,speed:340,coins:0,stars:0,foods:[],continues:3,used:0,penalty:0,
  slime:null,obstacles:[],pickups:[],parts:[],pops:[],clouds:[],starsBg:[],
  spawnT:1.4,shake:0,combo:0,comboT:0,countT:0,crashT:0,contT:0,msgT:0,worldX:0,hud:{},_prev:'play',
  init(){this.loop=makeLoop((dt,t)=>this.step(dt,t));new ResizeObserver(()=>this.resize()).observe($('#arena-run'));
    bindSwipeUp($('#run-canvas'),this,$('#run-pad'));bindSwipeUp($('#run-pad'),this,$('#run-pad'));},
  resize(){layoutStage('#arena-run','#run-wrap',118);const f=fitCanvas($('#run-wrap'),$('#run-canvas'));if(f)Object.assign(this,f);},
  reset(){Object.assign(this,{dist:0,speed:RUN.BASE,coins:0,stars:0,foods:[],continues:3,used:0,penalty:0,obstacles:[],pickups:[],parts:[],pops:[],spawnT:1.4,shake:0,combo:0,comboT:0,countT:1,crashT:0,contT:0,msgT:0,worldX:0,hud:{}});
    this.slime={y:0,vy:0,grounded:true,squash:0,inv:0,buffer:0};
    this.clouds=Array.from({length:5},()=>({x:Math.random()*this.W,y:30+Math.random()*110,s:.6+Math.random()*.8,v:8+Math.random()*14}));
    this.starsBg=Array.from({length:70},()=>({x:Math.random(),y:Math.random()*.55,r:.8+Math.random()*1.6,p:Math.random()*6}));
    this.hideMsg();},
  start(){if(this.phase!=='idle'&&this.phase!=='over')return;
    const p=activePet();if(!p)return toast('🥚','Tetaskan slime dulu!');if(p.sleepUntil&&p.sleepUntil>Date.now())return toast('💤','Slime-mu sedang tidur!');if(p.energy<ACT_COST)return toast('⚡',`Butuh ${ACT_COST}⚡!`);
    Rain.teardown();T.teardown();closeMenu();closeResult();
    p.energy-=ACT_COST;save();this.pet=p;spriteFor(p);
    hideEl('arena-hub');hideEl('arena-rps');hideEl('arena-rain');hideEl('arena-tactic');showEl('arena-run');
    this.resize();this.reset();this.phase='countdown';this.setMsg('SIAP…');sfx('click');this.loop.start();renderHome();},
  setMsg(t){$('#run-msg-txt').textContent=t;openOv('run-msg');const s=$('#run-msg-txt');s.classList.remove('pop-in');void s.offsetWidth;s.classList.add('pop-in');},
  hideMsg(){closeOv('run-msg');},
  jump(){if(this.phase!=='play')return;const s=this.slime;if(s.grounded){s.vy=RUN.JUMP;s.grounded=false;s.buffer=0;s.squash=-.18;sfx('jump');this.dust(RUN.X,this.groundY,6);}else s.buffer=.12;},
  dust(x,y,n){for(let i=0;i<n;i++)this.parts.push({x:x+(Math.random()-.5)*40,y:y-4,vx:(Math.random()-.5)*120,vy:-Math.random()*90,g:300,life:.5,max:.5,r:3+Math.random()*4,c:'rgba(120,150,110,.7)',type:'c'});},
  suspend(){if(this.phase==='countdown'||this.phase==='play')this.openMenu('pause');else if(this.phase==='continue')this.loop.stop();},
  wake(){if(this.phase==='continue'&&!this.loop.on)this.loop.start();},
  openMenu(mode){if(!['countdown','play'].includes(this.phase))return;this._prev=this.phase;this.phase='menu';this.loop.stop();musicStop();
    showMenu(mode==='quit'

      if(kind==='atk'){
        if(!hit){if(isPlayer)this.stats.miss++;this.say(fumble?`Aduh! ${who} terpeleset…`:`${who} meleset!`);sfx('miss');
          this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} SERANG · D20 ${roll}${dp?`+${dp}`:''}=${total} → MISS`});actor.focus=false;this.bars();this.after(700,()=>this.next(isPlayer));return;}
        const n=crit?2:1,dice=Array.from({length:n},()=>1+rnd(4)),sum=dice.reduce((a,b)=>a+b,0);
        this.showDamage(dice,crit,()=>{
          const absorbed=target.shield;let dmg=sum+actor.dmg-target.def-absorbed;target.shield=0;dmg=Math.max(1,dmg);
          target.hp=Math.max(0,target.hp-dmg);
          if(isPlayer){this.stats.dealt+=dmg;this.stats.hit++;if(crit)this.stats.crit++;}else this.stats.taken+=dmg;
          this.bars();this.float(isPlayer?'e':'p','-'+dmg);this.shake();if(crit)this.flash();sfx(crit?'crit':'hit');
          this.say(crit?`KRITIKAL! ${dmg} damage!`:`Kena! ${dmg} damage${absorbed?` (perisai -${absorbed})`:''}.`);
          this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} SERANG · D20 ${roll}${dp?`+${dp}`:''}=${total} → ${crit?'CRITICAL':'HIT'} · dadu ${dice.join('+')} +${actor.dmg} DMG${target.def?` −${target.def} DEF`:''}${absorbed?` −${absorbed} perisai`:''} = ${dmg} damage`});
          actor.focus=false;this.bars();this.after(850,()=>this.next(isPlayer));});
      } else if(kind==='grd'){
        if(hit){actor.shield=2+actor.def;this.say(`${who} memasang perisai ${actor.shield}!`);sfx('guard');this.float(isPlayer?'p':'e','🛡'+actor.shield);
          this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} BERTAHAN · ${total} → perisai ${actor.shield}`});}
        else{actor.shield=0;this.say(`${who} gagal bertahan!`);sfx('miss');this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} BERTAHAN · ${total} → gagal`});}
        this.bars();this.after(750,()=>this.next(isPlayer));
      } else if(kind==='foc'){
        if(hit){actor.focus=true;this.say(`${who} memusatkan energi!`);sfx('star');this.float(isPlayer?'p':'e','✨+3');
          this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} FOKUS · ${total} → +3 DP & kritikal 18+`});}
        else{this.say(`${who} gagal fokus…`);sfx('miss');this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} FOKUS · ${total} → gagal`});}
        this.bars();this.after(750,()=>this.next(isPlayer));
      } else {
        if(hit){const d=1+rnd(4),heal=Math.min(d+1,actor.max-actor.hp);actor.hp+=heal;this.float(isPlayer?'p':'e','+'+heal);sfx('heal');
          this.say(`${who} pulih ${heal} HP!`);this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} PULIH · ${total} → +${heal} HP`});}
        else{this.say(`${who} gagal memulih…`);sfx('miss');this.log.push({t:this.turn,k:isPlayer?'p':'e',x:`${who} PULIH · ${total} → gagal`});}
        this.bars();this.after(750,()=>this.next(isPlayer));
      }});
  },
  showDice(roll,dp,total,hit,crit,fumble,kind,done){
    const label={atk:'SERANGAN',foc:'FOKUS',grd:'BERTAHAN',heal:'PEMULIHAN'}[kind];
    $('#tac-dice').innerHTML=`<div class="panel p-4 text-center pop-in w-full max-w-xs max-h-full overflow-y-auto scroll-slim">
      <p class="font-disp text-base text-ink/70">🎲 ROLL D20 · ${label}</p>
      <div class="die-box mx-auto my-2 die-roll" id="tac-die">${d20SVG(1)}</div>
      <p class="text-[11px] font-bold opacity-60">D20 ${dp?`+ ${dp} DP `:''}&gt; 10 = HIT</p>
      <div id="tac-stamp" class="min-h-8 mt-1"></div>
      <div id="tac-dmgdice" class="flex justify-center gap-2 mt-1"></div></div>`;
    openOv('tac-dice');
    const die=$('#tac-die');let ticks=0;
    const iv=setInterval(()=>{ticks++;if(die)die.innerHTML=d20SVG(1+rnd(20));if(ticks%2===0)sfx('tick');},70);
    this.timers.push(iv);
    this.after(680,()=>{clearInterval(iv);if(die){die.classList.remove('die-roll');die.innerHTML=d20SVG(roll);die.classList.add('pop-in');}
      const st=$('#tac-stamp'),txt=fumble?'FUMBLE!':crit?'CRITICAL!':hit?'HIT!':'MISS',col=fumble||!hit?'text-coral':crit?'text-gold':'text-leaf';
      if(st)st.innerHTML=`<p class="font-disp text-3xl stamp ${col}">${txt}</p><p class="text-xs font-bold opacity-70">${roll}${dp?` + ${dp}`:''} = <b>${total}</b></p>`;
      sfx(fumble?'error':crit?'crit':hit?'pop':'miss');
      this.after(crit?620:480,()=>{if(kind!=='atk'||!hit)closeOv('tac-dice');done();});});
  },
  showDamage(dice,crit,done){
    const box=$('#tac-dmgdice');
    if(box)box.innerHTML=dice.map((_,i)=>`<div class="die-sm die-roll" id="tac-d4-${i}">${d4SVG(1)}</div>`).join('');
    const iv=setInterval(()=>{dice.forEach((_,i)=>{const e=$('#tac-d4-'+i);if(e)e.innerHTML=d4SVG(1+rnd(4));});sfx('tick');},80);
    this.timers.push(iv);
    this.after(560,()=>{clearInterval(iv);dice.forEach((v,i)=>{const e=$('#tac-d4-'+i);if(e){e.classList.remove('die-roll');e.innerHTML=d4SVG(v);e.classList.add('pop-in');}});
      const st=$('#tac-stamp');if(st)st.innerHTML+=`<p class="text-xs font-bold text-gold">${crit?'2D4':'1D4'} = ${dice.reduce((a,b)=>a+b,0)}</p>`;
      this.after(520,()=>{closeOv('tac-dice');done();});});
  },
  next(wasPlayer){
    if(this.E.hp<=0)return this.finish('win');
    if(this.P.hp<=0)return this.finish('lose');
    if(!wasPlayer){this.turn++;if(this.turn>TAC_TURN_CAP)return this.finish('draw');return this.beginTurn();}
    this.phase='enemy';this.setButtons(false);
    this.after(500,()=>{
      const E=this.E,P=this.P;let kind='atk';const r=Math.random();
      if(E.hp<E.max*.35&&r<.4)kind='heal';
      else if(!E.focus&&r<.22)kind='foc';
      else if(r<.34&&P.focus)kind='grd';
      const names={atk:'SERANG',foc:'FOKUS',grd:'BERTAHAN',heal:'PULIH'};
      this.say(`${E.name} pakai ${names[kind]}!`);
      this.after(420,()=>this.resolve(E,P,kind,false));});
  },
  finish(outcome){
    if(this.phase==='over'||this.phase==='idle')return;
    this.clearTimers();musicStop();closeOv('tac-dice');closeMenu();this.setButtons(false);
    const D=DIFFS[this.diff],p=this.pet,m=D.mult;
    const baseExp=5+this.E.lv*2,baseCoins=10+this.E.lv*2;
    let exp=0,coins=0,itemCount=0,title='',cls='';
    if(outcome==='win'){exp=baseExp*m;coins=baseCoins*m;itemCount=m;title='🏆 MENANG!';cls='text-gold';S.tacWins++;sfx('win');}
    else if(outcome==='lose'){exp=2;coins=3;title='💀 KALAH…';cls='text-coral';sfx('lose');}
    else if(outcome==='draw'){exp=Math.floor(baseExp*.4*m);coins=Math.floor(baseCoins*.4*m);title='🤝 SERI';cls='text-deep';sfx('pop');}
    else{exp=1;coins=2;title='🏃 KABUR';cls='text-ink/70';sfx('miss');}
    const drops=[];for(let i=0;i<itemCount;i++){const f=FOODS[rnd(FOODS.length)].id;drops.push(f);S.inv.foods[f]=(S.inv.foods[f]||0)+1;}
    S.tacPlays++;addCoins(coins);if(p)applyExp(p,exp);
    save();renderHome();renderNav();this.phase='over';
    const logHtml=this.log.map(l=>`<li class="logrow ${l.k==='p'?'text-ink':l.k==='e'?'text-coral':'text-ink/55'}"><span class="chip !text-[10px] !py-0 !px-1.5 shrink-0 ${l.k==='e'?'!bg-coral/20':l.k==='p'?'!bg-aqua/20':''}">${l.t?('T'+l.t):'INFO'}</span><span class="flex-1">${esc(l.x)}</span></li>`).join('');
    const evoBtn=evoReady(p)?`<button onclick="T.teardown();setTab('home');evolve()" class="btn bg-violet text-white w-full glow-pulse">🧬 EVOLUSI SEKARANG!</button>`:'';
    showResult({title,cls,sub:`${D.emoji} ${D.label} ×${m} · ${esc(this.E.name)} LV.${this.E.lv} · ${this.turn} giliran`,
      body:`<div class="text-sm font-bold">${statRow('🪙','Koin didapat','+'+coins,'text-gold')}${statRow('⭐','EXP didapat','+'+exp,'text-leaf')}${statRow('⚔️','Damage diberi',this.stats.dealt)}${statRow('💢','Damage diterima',this.stats.taken)}${statRow('🎯','Hit / Miss / Kritikal',`${this.stats.hit} / ${this.stats.miss} / ${this.stats.crit}`)}${statRow('❤️','HP tersisa',`${Math.max(0,this.P.hp)}/${this.P.max}`)}
        <p class="font-disp text-sm pt-3 pb-1.5 opacity-70">🎁 HADIAH ITEM (×${m})</p><div class="flex flex-wrap gap-1.5">${itemChips(drops)}</div>
        <p class="font-disp text-sm pt-3 pb-1.5 opacity-70">📜 LOG PERTARUNGAN · ${this.log.length} ENTRI</p>
        <ul class="rounded-2xl border-[3px] border-ink/15 bg-white/70 p-3 space-y-2">${logHtml}</ul></div>`,
      buttons:`${evoBtn}<button onclick="T.start('${this.diff}')" class="btn bg-gold text-lg" ${!activePet()||activePet().energy<ACT_COST?'disabled':''}>↺ Tanding Lagi (−${ACT_COST}⚡)</button><button onclick="T.teardown();showArenaHub()" class="btn bg-white">🏠 Keluar ke Arena</button>`});
  }
};

let B=null;
const hearts=n=>'❤️'.repeat(n)+'🤍'.repeat(3-n);
function startDuel(id){const p=activePet();if(!canAct(p))return;if(gameBusy())return toast('🎮','Selesaikan permainan dulu!');
  p.energy-=ACT_COST;save();B={bot:BOTS.find(b=>b.id===id),hpP:3,hpE:3,round:0,busy:false,over:false,log:[]};sfx('click');renderDuel();renderHome();}
function duelAgain(){closeResult();B=null;showArenaHub();renderDuelPick();}
function duelExit(){closeResult();B=null;showArenaHub();}
function pickRPS(id){if(!B||B.busy||B.over)return;B.busy=true;sfx('click');const pick=RPS.find(r=>r.id===id);
  $('#p-choice').textContent='✊';$('#e-choice').textContent='✊';const step=$('#round-step');step.textContent='Gunting…';
  setTimeout(()=>{if(step.isConnected)step.textContent='Batu…';},300);setTimeout(()=>{if(step.isConnected)step.textContent='Kertas!';},600);
  setTimeout(()=>{if(!B||!$('#p-choice'))return;const e=RPS[rnd(3)];$('#p-choice').textContent=pick.e;$('#e-choice').textContent=e.e;
    const res=pick.beats===e.id?'win':(e.beats===pick.id?'lose':'draw');
    if(res==='win'){B.hpE--;sfx('pop');}else if(res==='lose'){B.hpP--;sfx('error');}
    const bn=$('#round-banner');bn.textContent=res==='win'?'RONDE MENANG! 🎉':res==='lose'?'KALAH RONDE 💦':'SERI! 🤝';bn.className='font-disp text-lg text-center '+(res==='win'?'text-leaf':res==='lose'?'text-coral':'text-gold');
    B.round++;B.log.unshift(`R${B.round}: ${pick.e} vs ${e.e} → ${res==='win'?'MENANG':res==='lose'?'KALAH':'SERI'}`);
    if(B.hpE<=0)return endDuel('win');if(B.hpP<=0)return endDuel('lose');if(B.round>=8)return endDuel(B.hpE<B.hpP?'win':B.hpP<B.hpE?'lose':'draw');
    $('#hp-p').innerHTML=hearts(B.hpP);$('#hp-e').innerHTML=hearts(B.hpE);B.busy=false;$('#b-log').innerHTML=B.log.slice(0,4).map(x=>`<li>• ${esc(x)}</li>`).join('');},950);}
function endDuel(res){B.over=true;const p=activePet();
  const coins=res==='win'?B.bot.coins:res==='draw'?Math.round(B.bot.coins/2):2;
  const exp=res==='win'?5+Math.floor((p?p.level:1)*.6):res==='draw'?3:0;
  applyExp(p,exp);addCoins(coins);if(p)setTempMood(p,res==='lose'?'sad':'excite');

    sub:`Duel Gunting-Batu-Kertas · ${B.bot.name} · ${B.round} ronde`,
    body:`<div class="text-sm font-bold">${statRow('🪙','Koin didapat','+'+coins,'text-gold')}${statRow('⭐','EXP didapat','+'+exp,'text-leaf')}${statRow('❤️','Nyawa tersisa',hearts(B.hpP))}
      <p class="font-disp text-sm pt-3 pb-1.5 opacity-70">📜 LOG RONDE</p>

    body=`<div class="hostcard !bg-cream2">

        <p class="text-[12px] font-bold opacity-75 mt-1">${files.length} file · HTML game ${size} KB · tanpa build, tanpa dependensi lokal.</p>
        <button onclick="dlPack()" class="btn bg-gold w-full mt-3 text-lg glow-pulse">⬇️ UNDUH PAKET .ZIP</button>
        <div class="flex gap-2 mt-2">
          <button onclick="dlOne('index.html')" class="btn bg-white flex-1 !text-[11px]">⬇️ index.html saja</button>
          <button onclick="doCopy('${copyKey(exportHTML())}')" class="btn bg-white flex-1 !text-[11px]">📋 Salin seluruh HTML</button>
        </div>
        <p class="text-[10.5px] font-bold opacity-60 mt-2">Kalau unduhan diblokir panel preview, buka halaman ini di tab browser baru lalu ulangi.</p>
      </div>
      <p class="font-disp text-sm mt-3 mb-1.5 opacity-70">ISI PAKET · KLIK UNTUK UNDUH SATUAN</p>
      <div class="grid grid-cols-2 gap-2">${files.map(f=>`<button onclick="dlOne('${f.name}')" class="itemcard !flex-row items-center !p-2 gap-2 text-left hover:bg-cream2">
        <span class="text-lg shrink-0">${f.name.endsWith('.html')?'📄':f.name.endsWith('.svg')?'🖼️':f.name.endsWith('.md')?'📘':f.name.endsWith('.json')||f.name.endsWith('.webmanifest')?'⚙️':f.name==='sw.js'?'📡':'🔧'}</span>
        <span class="min-w-0"><b class="text-[11.5px] block truncate">${f.name}</b><span class="text-[9.5px] font-bold opacity-55">${(new Blob([f.text]).size/1024).toFixed(1)} KB</span></span></button>`).join('')}</div>
      <div class="hostcard mt-3 !bg-white/85"><b class="font-disp text-base">✅ CEK KESIAPAN</b>
        <div class="mt-1.5 space-y-1 text-[12px] font-bold">
          ${[['Satu file, tanpa build',true],['Favicon maskot tertanam di HTML',true],['Progres tersimpan lokal (localStorage + cookie)',true],['HTTPS untuk PWA & service worker',st.https],['Service worker offline aktif',st.sw]].map(([l,ok])=>`<div class="flex items-center gap-2"><span class="chip !text-[10px] !py-0 !px-1.5 ${ok?'!bg-leaf/25':'!bg-gold/25'}">${ok?'✔':'!'}</span><span class="${ok?'':'opacity-70'}">${l}</span></div>`).join('')}
        </div>
        <p class="text-[10.5px] font-bold opacity-60 mt-2">${st.sw?'Offline siap: game bisa dibuka tanpa internet.':'Service worker aktif setelah paket di-upload ke hosting HTTPS (file sw.js sudah termasuk).'}</p>
      </div>`;
  }
  if(deployTab==='pwa'){
    const urlK=copyKey(location.href);
    body=`<div class="hostcard !bg-gradient-to-br !from-[#dff6ff] !to-[#e6fbdc]">
        <div class="flex items-center gap-3"><span class="shrink-0 mascot-bob">${mascotSVG(52)}</span><div><b class="font-disp text-xl block leading-tight">PASANG SEPERTI APLIKASI</b><p class="text-[11px] font-bold opacity-70">Ikon maskot slime muncul di home screen.</p></div></div>
        <button onclick="doInstall()" class="btn bg-gold w-full mt-3 text-lg" ${INSTALL_EVT?'':'disabled'}>⬇️ PASANG SEKARANG</button>
        <p class="text-[10.5px] font-bold opacity-65 mt-2">${INSTALL_EVT?'Browser kamu mendukung instalasi satu klik.':'Belum tersedia di sini. Di Android/Chrome: menu ⋮ → <b>Install app</b>. Di iPhone/Safari: Share → <b>Add to Home Screen</b>. Butuh HTTPS + manifest + sw.js dari paket.'}</p>
      </div>
      <div class="grid grid-cols-2 gap-2 mt-3">
        ${[['📡','Service worker',st.sw?'AKTIF':'BELUM'],['🖥️','Mode aplikasi',st.standalone?'STANDALONE':'BROWSER'],['🔒','Koneksi aman',st.https?'HTTPS':'LOKAL'],['🌐','Jaringan',st.online?'ONLINE':'OFFLINE']].map(([e,l,v])=>`<div class="itemcard !p-2.5 items-center text-center"><span class="text-2xl">${e}</span><span class="text-[10px] font-bold opacity-60">${l}</span><b class="font-disp text-sm">${v}</b></div>`).join('')}
      </div>
      <div class="hostcard mt-3 !bg-white/85"><b class="font-disp text-base">🔗 BAGIKAN LINK</b>
        <div class="codeblk mt-2">${esc(location.href)}</div>
        <div class="flex gap-2 mt-2">
          <button onclick="doCopy('${urlK}')" class="btn bg-gold flex-1 !text-[11px]">📋 Salin URL</button>
          <button onclick="dlOne('icon.svg')" class="btn bg-white flex-1 !text-[11px]">⬇️ icon.svg</button>
          <button onclick="dlOne('sw.js')" class="btn bg-white flex-1 !text-[11px]">⬇️ sw.js</button>
        </div></div>
      <p class="text-[11px] font-bold opacity-60 mt-3">Progres pemain tersimpan di perangkat masing-masing. Hosting statis = tidak ada data pemain yang dikirim ke server mana pun.</p>`;
  }
  showModal(`<div class="panel overflow-hidden">
    <div class="p-4 pb-3 bg-gradient-to-r from-[#dff6ff] via-[#eafcff] to-[#e6fbdc] border-b-[3px] border-ink/10">
      <div class="flex items-center gap-2.5">
        <span class="shrink-0 mascot-bob">${mascotSVG(42)}</span>
        <div class="flex-1 min-w-0"><h3 class="font-disp text-2xl leading-none">DEPLOY STUDIO</h3>
          <p class="text-[10.5px] font-bold opacity-65 mt-0.5">Bawa SlimeGochi online · v1.0.1 Beta · ${size} KB</p></div>
        <button onclick="closeModal()" class="btn bg-white !px-2.5 !py-1 !text-sm shrink-0">✕</button>
      </div>
      <div class="flex gap-1.5 mt-3">${tabs.map(([id,l])=>`<button onclick="deployTab='${id}';renderDeploy()" class="tabbtn flex-1 ${deployTab===id?'active':''}">${l}</button>`).join('')}</div>
    </div>
    <div class="p-4">${body}</div></div>`);}
function doInstall(){if(!INSTALL_EVT)return toast('⚠️','Gunakan menu browser → Install app.');
  try{INSTALL_EVT.prompt();INSTALL_EVT.userChoice.then(()=>{INSTALL_EVT=null;renderDeploy();});}catch(e){toast('⚠️','Instalasi tidak tersedia di sini.');}}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();INSTALL_EVT=e;if(!$('#modal-root').classList.contains('hide')&&deployTab==='pwa')renderDeploy();});
window.addEventListener('appinstalled',()=>{INSTALL_EVT=null;toast('🎉','SlimeGochi terpasang di perangkatmu!');});

/* ============================ TICK ============================ */
let lastTick=Date.now(),decayAcc=0,zzzAcc=0;
setInterval(()=>{const now=Date.now(),dt=(now-lastTick)/1000;lastTick=now;const p=activePet();
  if(p&&!(p.sleepUntil&&p.sleepUntil>now)){decayAcc+=dt;if(decayAcc>=1){const st=decayAcc;decayAcc=0;p.full=Math.max(0,p.full-st/15);p.fun=Math.max(0,p.fun-st/18);p.clean=Math.max(0,p.clean-st/22);}}
  if(p&&p.sleepUntil&&now>=p.sleepUntil){p.sleepUntil=null;p.energy=ENERGY_MAX;setTempMood(p,'excite');sfx('level');toast('☀️','Bangun segar! Energi penuh.');save();if(curTab==='home')renderHome();}
  updateTickUI();},500);
function updateTickUI(force=false){const p=activePet(),now=Date.now();
  if(S.incubator){const ready=S.incubator.endsAt<=now,c=$('#egg-cd');if(c)c.textContent=fmtCd(S.incubator.endsAt-now);if(ready&&!S.incubator.notified){S.incubator.notified=true;sfx('hatch');toast('🥚','Telur siap menetas!');renderNav();if(curTab==='egg')renderEgg();}}
  if(!p)return;
  if(p.sleepUntil&&p.sleepUntil>now){const dur=sleepDur(),left=p.sleepUntil-now;const sf=$('#sleep-fill');if(sf)sf.style.width=((dur-left)/dur*100)+'%';const sc=$('#sleep-cd');if(sc)sc.textContent=fmtCd(left);zzzAcc++;if(zzzAcc%6===0){const box=$('#zzz-box')||$('#scene');if(box){const z=document.createElement('span');z.className='zzz text-2xl';z.textContent='Z';z.style.left=(45+Math.random()*15)+'%';z.style.top='35%';box.appendChild(z);setTimeout(()=>z.remove(),2300);}}}
  const set=(id,fn)=>{const e=$(id);if(e)fn(e);};
  set('#exp-fill',e=>e.style.width=(p.level>=MAX_LV?100:Math.min(100,p.exp/EXP_NEED(p.level)*100))+'%');
  set('#exp-txt',e=>e.textContent=p.level>=MAX_LV?'MAX LEVEL 100':`${Math.floor(p.exp)} / ${EXP_NEED(p.level)} EXP`);
  set('#bar-full',e=>e.style.width=p.full+'%');set('#txt-full',e=>e.textContent=Math.round(p.full));
  set('#bar-fun',e=>e.style.width=p.fun+'%');set('#txt-fun',e=>e.textContent=Math.round(p.fun));
  set('#bar-clean',e=>e.style.width=p.clean+'%');set('#txt-clean',e=>e.textContent=Math.round(p.clean));
  const pips=$('#energy-pips');if(pips&&(force||+pips.dataset.v!==p.energy)){pips.dataset.v=p.energy;pips.innerHTML=Array.from({length:ENERGY_MAX},(_,i)=>`<div class="pip ${i<p.energy?'on':''}"></div>`).join('');}
  const mb=$('#mood-bubble');if(mb){let need='';if(p.full<30)need='🍎❗';else if(p.clean<30)need='🫧❗';else if(p.fun<30)need='🎾❗';else if(p.energy<ACT_COST)need='⚡❗';const face={happy:'😊',excite:'🤩',neutral:'😐',sad:'😢',tired:'🥱',sleep:'😴'}[moodOf(p)];mb.innerHTML=`<span class="chip !bg-white/90 !py-0.5 !px-2.5 text-base">${face}${need?` <span style="animation:bounceK 1s infinite" class="inline-block">${need}</span>`:''}</span>`;}}

/* ============================ EVENTS & INIT ============================ */
$('#btnSound').onclick=()=>{S.sound=!S.sound;if(!S.sound)musicStop();else if(Run.phase==='play'||Rain.phase==='play'||T.active())musicStart();save();renderHeader();if(S.sound)sfx('pop');};
$('#saveDot').onclick=()=>{save();sfx('click');toast('💾','Progres disimpan ke cache & cookie browser.');};
$('#btnDeploy').onclick=openDeploy;
$('#btnReset').onclick=()=>{showModal(`<div class="panel p-6 text-center"><p class="font-disp text-3xl text-coral">RESET TOTAL?</p><p class="text-sm font-bold opacity-75 mt-2">Semua slime, koin, atribut, dan rekor akan dihapus permanen dari perangkat ini.</p><div class="flex flex-col gap-2 mt-4"><button onclick="doReset()" class="btn bg-red-300 text-lg">🗑️ Ya, Hapus Semua</button><button onclick="closeModal()" class="btn bg-white">Batal</button></div></div>`);};
function doReset(){musicStop();Run.teardown();Rain.teardown();T.teardown();closeModal();
  try{localStorage.removeItem(KEY);}catch(e){}setCookie(CKEY,'',0);
  S=defaultState();B=null;SPR.key='';save();renderHeader();renderNav();setTab('egg');toast('↺','Permainan direset. Telur baru menantimu!');}
$('#btnHelp').onclick=()=>{showModal(`<div class="panel p-5 text-sm font-bold space-y-2"><div class="flex items-center gap-2.5"><span class="shrink-0 mascot-bob">${mascotSVG(46)}</span><h3 class="font-disp text-2xl leading-none">CARA MAIN<br><span class="text-[11px] font-body font-bold opacity-60">SlimeGochi · v1.0.1 Beta</span></h3></div><p>🥚 <b>LV.0 = Telur.</b> Eramkan (1 menit, ×5 tiap slime berikutnya, atau ⚡ Instant-Hatch). Saat menetas, <b>beri nama sendiri</b> atau pakai default 🎲.</p><p>🫧 Rawat: Makan / Main / Servis = EXP (−2⚡ per aksi, maks 10⚡). Isi energi lewat makan atau tidur. <b>Level maksimal 100.</b></p><p>🧬 <b>LV.10 → EVOLUSI</b>: elemen acak 1 dari 10 + <b>5 poin atribut permanen</b>. Setelah itu level terus naik sampai 100.</p><p>🏃 <b>SlimeGo!</b> swipe ↑ di area bawah untuk lompat (desktop: SPASI/↑). 3× lanjut, tiap lanjut −20% koin.</p><p>🍎 <b>Slime Rain!</b> swipe ← → di area bawah. 3 item = 1 🪙, ⏰ +3 detik, durasi 15 detik.</p><p>⚔️ <b>Slime Tactic</b>: aksi → <b>D20 + DP &gt; 10 = HIT</b>, damage <b>1D4</b>, kritikal <b>2D4</b>. Kesulitan: Mudah (−1~+2, ×1), Sulit (−1~+3, ×2), Neraka (+0~+5, ×5). Keyboard 1–4.</p><p>🧬 Toko → <b>Atribut</b>: +1 DMG / HP / DEF / DP, maks <b>+5</b> per jenis.</p><p>☁️ Tombol <b>DEPLOY</b> di footer membuka Deploy Studio: pilihan hosting gratis + paket siap-upload.</p><p>💾 Progres tersimpan otomatis di cache & cookie browser — titik hijau di footer untuk simpan manual.</p><div class="flex gap-2 pt-1"><button onclick="closeModal();openDeploy()" class="btn bg-deep text-white flex-1">☁️ Deploy</button><button onclick="closeModal()" class="btn bg-gold flex-1">Siap! 🚀</button></div></div>`);};
window.addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Escape'&&!$('#modal-root').classList.contains('hide')){closeModal();return;}
  if(curTab!=='battle')return;
  if(['Space','ArrowUp','KeyW'].includes(e.code)&&Run.phase==='play'){e.preventDefault();if(!e.repeat)Run.jump();}
  if(e.code==='ArrowLeft'&&Rain.phase==='play'){e.preventDefault();Rain.keys.left=true;}
  if(e.code==='ArrowRight'&&Rain.phase==='play'){e.preventDefault();Rain.keys.right=true;}
  if(T.phase==='player'){const m={Digit1:'atk',Digit2:'foc',Digit3:'grd',Digit4:'heal'};if(m[e.code]){e.preventDefault();T.act(m[e.code]);}}
  if(e.code==='KeyP'||e.code==='Escape'){
    if(Run.phase==='play'||Run.phase==='countdown')Run.openMenu('pause');else if(Run.phase==='menu')Run.resume();
    else if(Rain.phase==='play'||Rain.phase==='countdown')Rain.openMenu('pause');else if(Rain.phase==='menu')Rain.resume();
    else if(T.phase==='player')T.openMenu('pause');else if(T.phase==='menu')T.resume();}});
window.addEventListener('keyup',e=>{if(e.code==='ArrowLeft')Rain.keys.left=false;if(e.code==='ArrowRight')Rain.keys.right=false;});
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();Run.suspend();Rain.suspend();T.suspend();}else if(curTab==='battle')Run.wake();});
window.addEventListener('blur',()=>{Run.suspend();Rain.suspend();T.suspend();});
window.addEventListener('pagehide',save);
window.addEventListener('resize',()=>{if(curTab!=='battle')return;if(Run.phase!=='idle')Run.resize();if(Rain.phase!=='idle')Rain.resize();if(T.phase!=='idle')T.resize();});
Run.init();Rain.init();T.init();
(function init(){const p=activePet();if(p&&S.lastSeen){const gone=Math.min(1800,(Date.now()-S.lastSeen)/1000);p.full=Math.max(10,p.full-gone/15);p.fun=Math.max(10,p.fun-gone/18);p.clean=Math.max(10,p.clean-gone/18);}
  if(S.incubator&&S.incubator.endsAt<=Date.now())S.incubator.notified=true;
  renderHeader();renderNav();setTab(S.pets.length===0&&!S.incubator?'egg':'home');save();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(()=>{SW_OK=true;}).catch(()=>{SW_OK=false;});}
})();
</script>
</body>
</html>
